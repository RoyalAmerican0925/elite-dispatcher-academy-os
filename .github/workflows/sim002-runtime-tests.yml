name: SIM-002 Runtime Tests

on:
  push:
    branches: [academy-master-architecture, modules-02-03-premium-reconciliation]
    paths:
      - '05-SIMULATIONS-AND-GAMES/Module-02/**'
      - '03-ASSESSMENTS/Practical-Assessments/Module-02-Practical.md'
      - '00-PROJECT-CONTROL/MODULE-02-*'
      - '10-PRODUCTION/Module-02-*'
      - '00-ACADEMY-MASTER/MODULE-02-MASTER-BRANCH.md'
      - '.github/workflows/sim002-runtime-tests.yml'
  pull_request:
    paths:
      - '05-SIMULATIONS-AND-GAMES/Module-02/**'
      - '03-ASSESSMENTS/Practical-Assessments/Module-02-Practical.md'
      - '00-PROJECT-CONTROL/MODULE-02-*'
      - '10-PRODUCTION/Module-02-*'
      - '00-ACADEMY-MASTER/MODULE-02-MASTER-BRANCH.md'
      - '.github/workflows/sim002-runtime-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-SIMULATIONS-AND-GAMES/Module-02/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run SIM-002 premium tests
        run: npm test
