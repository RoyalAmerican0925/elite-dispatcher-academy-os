name: SIM-004 Runtime Tests

on:
  push:
    paths:
      - '05-SIMULATIONS-AND-GAMES/Module-04/runtime/**'
      - '.github/workflows/sim004-runtime-tests.yml'
  pull_request:
    paths:
      - '05-SIMULATIONS-AND-GAMES/Module-04/runtime/**'
      - '.github/workflows/sim004-runtime-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-SIMULATIONS-AND-GAMES/Module-04/runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run SIM-004 runtime tests
        run: npm test
