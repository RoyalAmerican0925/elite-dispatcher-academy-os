name: SIM-001 Runtime Tests

on:
  push:
    branches: [main]
    paths:
      - '05-SIMULATIONS-AND-GAMES/Module-01/runtime/**'
      - '.github/workflows/sim001-runtime-tests.yml'
  pull_request:
    paths:
      - '05-SIMULATIONS-AND-GAMES/Module-01/runtime/**'
      - '.github/workflows/sim001-runtime-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-SIMULATIONS-AND-GAMES/Module-01/runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run SIM-001 runtime tests
        run: npm test
