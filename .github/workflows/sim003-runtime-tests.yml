name: SIM-003 Runtime Tests

on:
  push:
    branches: [academy-master-architecture, modules-02-03-premium-reconciliation]
    paths:
      - '05-SIMULATIONS-AND-GAMES/Module-03/**'
      - '03-ASSESSMENTS/Practical-Assessments/Module-03-Practical.md'
      - '00-PROJECT-CONTROL/MODULE-03-*'
      - '10-PRODUCTION/Module-03-*'
      - '00-ACADEMY-MASTER/MODULE-03-MASTER-BRANCH.md'
      - '.github/workflows/sim003-runtime-tests.yml'
  pull_request:
    paths:
      - '05-SIMULATIONS-AND-GAMES/Module-03/**'
      - '03-ASSESSMENTS/Practical-Assessments/Module-03-Practical.md'
      - '00-PROJECT-CONTROL/MODULE-03-*'
      - '10-PRODUCTION/Module-03-*'
      - '00-ACADEMY-MASTER/MODULE-03-MASTER-BRANCH.md'
      - '.github/workflows/sim003-runtime-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-SIMULATIONS-AND-GAMES/Module-03/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run SIM-003 premium tests
        run: npm test
