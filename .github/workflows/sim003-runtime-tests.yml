name: SIM-003 Runtime Tests

on:
  push:
    paths:
      - '05-SIMULATIONS-AND-GAMES/Module-03/runtime/**'
      - '.github/workflows/sim003-runtime-tests.yml'
  pull_request:
    paths:
      - '05-SIMULATIONS-AND-GAMES/Module-03/runtime/**'
      - '.github/workflows/sim003-runtime-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-SIMULATIONS-AND-GAMES/Module-03/runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run SIM-003 logic tests
        run: npm test
